version: '3.8'

services:
  # PostgreSQL with PostGIS extension pre-installed
  postgis:
    image: postgis/postgis:16-3.4
    container_name: school_bus_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: school_bus_tracker
    ports:
      - '5432:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d school_bus_tracker']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
    driver: local

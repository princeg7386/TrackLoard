name: school_bus_driver_app
description: "Minimalist, rock-solid Flutter Android background GPS telemetry app for school bus drivers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^12.0.0
  flutter_background_service: ^5.0.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3
  http: ^1.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
